name: Bug report
description: Report a reproducible error in repository tools or approved implementations.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: "For security vulnerabilities, follow SECURITY.md instead of posting private details."
  - type: input
    id: location
    attributes:
      label: Affected file or topic
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Include a minimal input and the exact command.
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Expected and actual results
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment and test output
      description: Include OS, Python/compiler versions, and relevant output without secrets.
