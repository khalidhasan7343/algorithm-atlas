name: Repository checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lightweight-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    env:
      CXX: g++
      PYTHONHASHSEED: "0"
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install lightweight development dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Validate catalog, structure, and relative documentation links
        run: python scripts/validate_catalog.py
      - name: Check generated catalog documentation
        run: python scripts/generate_catalog_docs.py --check
      - name: Run infrastructure and discovered algorithm tests on C++17 and C++20
        run: python -m pytest --require-cpp
